on:isolate;overflow:hidden}.deck:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(ellipse at 120% 100%,transparent 0px 22px,#78907a27 23px,transparent 24px);z-index:-1}.ticket{margin:9px auto;background:#faf9ed;border:1px solid #a5afa1;padding:16px 22px;border-radius:7px;box-shadow:0 3px 4px #243d2512;max-width:360px}.ticket:first-child{transform:rotate(-4deg)}.ticket:nth-child(2){transform:translateX(9px) rotate(2deg);background:#203d36;color:#fff}.ticket:nth-child(3){transform:rotate(-2deg)}.ticket span,.ticket small{display:block}.portraitName{font-weight:650;font-size:clamp(20px,3vw,34px);line-height:1.2}.ticket small{font-size:14px;margin-top:2px}.sheet{max-width:690px;margin:auto}h2{font-size:clamp(29px,4vw,47px);line-height:1.2;letter-spacing:-.025em;margin:18px 0}.opts{display:grid;gap:10px}.opt{text-align:left;border:1px solid var(--line);background:#fffefa;color:var(--ink);padding:16px;border-radius:7px;display:flex;gap:17px;align-items:center}.opt:hover,.opt.sel{background:#e5ede2;border-color:#72917b}.opt i{font:italic 20px Georgia;color:var(--accent)}progress{width:100%;height:6px;accent-color:var(--dark)}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}.plain{border:0;background:transparent;text-decoration:underline;text-underline-offset:4px;color:var(--muted);padding:8px 0}.panel,article{border:1px solid var(--line);border-radius:10px;background:#fffefa;padding:clamp(18px,3vw,34px);margin:16px 0}.panel h3,article h3{font-size:19px}.panel p{margin:6px 0 12px;color:var(--muted)}input{width:min(100%,260px);border:1px solid #8d9f91;border-radius:5px;padding:10px}.err{color:#97351c}.tiny,footer{font-size:14px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:16px 0 28px;display:flex;justify-content:space-between;gap:10px}#result article{border-top:5px solid var(--dark)}article h3{margin:20px 0 4px}#card{display:block;width:min(100%,340px);margin:10px 0}a{color:var(--dark)}@media(max-width:720px){header{height:65px}main{padding:30px 0}.front{grid-template-columns:1fr;gap:25px}.deck{padding:18px 26px}.ticket{padding:10px 18px;margin:5px auto}h1{margin:14px 0}.lead{margin:12px 0 18px}.brand{font-size:19px}.lang button{padding:5px 9px}.monogram{width:30px;height:30px}.tools>*{max-width:100%}}
.roster{margin-top:18px;color:var(--muted);font-size:15px}.roster summary{cursor:pointer;text-decoration:underline;text-underline-offset:3px}.roster p{margin-top:8px;line-height:1.8}.portrait{margin:22px 0}.portrait img{display:block;max-width:100%;width:auto;height:auto;max-height:365px;object-fit:contain;margin:0 auto}.portrait figcaption{line-height:1.5;font-size:13px;color:var(--muted);margin:9px auto 0;text-align:center;overflow-wrap:anywhere}.standfirst{font-family:var(--serif);font-size:1.22rem;margin:22px 0}.chapter{padding:20px 0 8px;border-top:1px solid var(--line)}.chapter h3{margin:0 0 8px;font-family:var(--serif);font-size:1.45rem}.chapter p{line-height:1.9;margin:0 0 13px}.chapter a{font-size:14px}</style></head><body><header><div class="brand"><span class="monogram" aria-hidden="true">H</span><span id="brand"></span></div><nav class="lang" aria-label="Language"><button id="zh" lang="zh-CN">中文</button><button id="en" lang="en">English</button></nav></header><main>

<section class="sheet" id="result" hidden><article><p class="label" id="edition"></p><h2 id="name" tabindex="-1"></h2><p id="bio"></p><figure class="portrait"><img id="portrait" alt=""><figcaption><span id="caption"></span><br><span id="credit"></span> · <a id="imageSource" target="_blank" rel="noopener"></a> · <a id="license" target="_blank" rel="noopener"></a></figcaption></figure><p id="connection" class="standfirst"></p><div id="chapters"></div></article><div class="tools"><button class="primary" id="save"></button><button class="quiet" id="restart"></button></div><div id="saved" hidden><p class="tiny" id="savehint"></p><a id="download" download="history-club.png"></a><img id="card" alt=""></div></section></main><footer><span>History Club</span><span id="foot"></span></footer><script>const questions=[[0,"你第一次做一道新菜，尝了一口，总觉得味道差一点。你先怎么做？","A new dish tastes almost right. What's your first move?",["再尝一小口，分清是淡了、酸了还是太腻","Taste again to work out what's missing"],["翻一下食谱，看自己漏了哪一步","Check the recipe for a missed step"],["盛出一勺，加一点调料试味","Season a spoonful and taste it"],["把锅分成两份，各试一种调味","Split it into two batches and try two seasonings"]],[0,"两家店卖同款椅子，评价截然相反。你怎么判断？","Two shops sell the same chair. Reviews disagree. How do you decide?",["看差评里描述的具体使用场景","Read how the unhappy buyers used it"],["比较两家标出的尺寸和材质","Compare the listed dimensions and materials"],["到店里坐五分钟再说","Sit on one for five minutes"],["借朋友的同款，在自己桌边用一晚","Borrow one and try it at my own desk"]],[0,"朋友讲了一个笑话，大家都没听懂，问你哪里出了问题。","A friend's joke falls flat. They ask you why.",["回想大家从哪句话开始困惑","Recall the line where people looked lost"],["把前后两句对照，找出漏说的信息","Compare the lines and spot a missing detail"],["把那句话换个说法，讲给朋友听","Try saying the line a different way"],["拉把椅子坐下，两人把整段重新演一次","Pull up a chair and rehearse the whole exchange"]],[0,"你想知道自己为什么总是错过早班车。你愿意先花一周做什么？","You keep missing the early bus. What would you try for a week?",["每天记下出门前最耗时的一件事","Log which morning task takes the longest"],["核对实际到站时间和时刻表","Compare actual arrivals with the timetable"],["把一个早晨的任务移到前一晚","Move one morning task to the night before"],["连续几天换路线，看看哪条顺手","Try different routes on successive days"]],[0,"一盆植物最近叶子发黄。你接下来做什么？","A houseplant's leaves are yellowing. What do you do next?",["看看黄叶集中在哪一侧、哪一层","Look at which leaves are affected and where"],["查清这个品种适合的光照和水量","Check the light and water this species needs"],["移到另一扇窗边，观察几天","Move it to another window for a few days"],["给两盆同品种的植物不同照料作比较","Try different care routines on two similar plants"]],[0,"你刚接手一个书架，东西放得很乱。你从哪里开始？","You've inherited a messy bookcase. Where do you start?",["先看看哪些书最常被抽出来","See which books get pulled out most often"],["列出书架上已有的几种分类","List the categories already on the shelves"],["先整理一格，看找书有没有更快","Rearrange one shelf and see if it's easier to use"],["把书摊开，边放回去边调整分组","Lay the books out and regroup as I put them back"]],[0,"朋友说新买的耳机听着发闷，让你帮着判断。","A friend says their new headphones sound muffled. How do you help?",["先听他形容，是哪一段声音不清楚","Ask exactly which sounds are hard to hear"],["看他常用播放器的音效设置","Review the settings on their usual player"],["播放一段熟悉的歌，现场切换设置","Play a familiar song and toggle one setting"],["拿两副耳机来一轮不看牌子的对听","Compare two pairs without looking at the brands"]],[0,"你第一次做面包，成品比预想的硬。下次动手前你更想……","Your first loaf was tougher than expected. Before baking again, you'd like to…",["切开面包，看看里面哪里最密实","Slice the loaf and inspect the densest part"],["对照记录，找出和食谱差别最大的一步","Find the biggest difference between my notes and the recipe"],["用半份面团试一种新的揉法","Try a different kneading technique on a half batch"],["把一团面分成几份，做一盘小实验","Divide the dough and run a tray of small experiments"]],[0,"大家常在群里漏看活动时间。你来改通知，会先做什么？","People keep missing the event time in the group chat. Where do you start?",["读几条旧通知，看时间通常藏在哪里","Read old notices and find where the time gets buried"],["问漏看的人当时是怎么读的","Ask someone to walk me through what they read"],["先发一条新格式，看看反馈","Send one revised notice and see how it lands"],["写两个版本，请朋友各找一次时间","Have friends find the time in two trial versions"]],[0,"你第一次走进一家排长队的小店。你最想怎样弄清它受欢迎的原因？","A little shop has a long queue. How do you find out what draws people?",["看大家出来时手里都拿着什么","Notice what people carry out"],["问一位常客每次为什么回来","Ask a regular what brings them back"],["点一份招牌，自己尝一下","Order the signature item and try it"],["约朋友各点一份，交换着比较","Order different things with friends and compare"]],[0,"你的自行车骑起来比平时费劲。你先怎么做？","Your bicycle feels harder to pedal than usual. What comes first?",["慢慢推几步，听听声音从哪里来","Walk it slowly and listen for the sound"],["依次检查胎压、刹车和链条","Check tyre pressure, brakes and chain in order"],["给轮胎补气，骑一小段看变化","Inflate the tyres and take a short ride"],["在平地换几个挡位，实际感受差异","Try the gears on a flat stretch and feel the difference"]],[0,"你准备学一段很短的舞步，第一遍会怎么跟？","You're learning a short dance. What do you do on the first run?",["从头看到尾，留心重心怎么移动","Watch the whole sequence and track the weight shifts"],["把视频放慢，分清脚步顺序","Slow it down and map out the footwork"],["跟着先做两步，再回去看","Try the first two steps and then look again"],["整段跟跳一次，卡住的地方再练","Dance the whole thing once and revisit the sticky spots"]],[0,"晚饭时大家争论哪种杯子保温更好，你想怎么解决？","At dinner, friends disagree over which mug holds heat better. What do you do?",["先看两只杯子的结构和厚度","Inspect their shape and thickness"],["找找生产商有没有公布实测数据","Look for published measurements"],["各倒一点热水，过会儿试试温度","Pour hot water into both and check later"],["约定水量和时间，来一场小比赛","Set equal volumes and a timer and run a trial"]],[0,"同事说最近开会总超时。你愿意在下次会上帮什么忙？","Meetings keep running late. What would you volunteer to do next time?",["记下话题在哪个环节开始岔开","Note exactly where the discussion wanders"],["会前对照两份议程和真实用时","Compare two past agendas with the actual timings"],["试着给一个议题设五分钟计时","Try a five-minute timer on one item"],["主持一次短会，现场调整节奏","Run a short meeting and adjust the pace on the spot"]],[0,"你想改一改卧室里读书的位置。你第一步会怎么做？","You want a better reading spot in your room. What's the first step?",["看下午的光会停在哪个角落","Watch where the afternoon light falls"],["量一下椅子、窗户和插座的距离","Measure the distances between chair, window and socket"],["把椅子挪到窗边读一章","Move the chair by the window and read a chapter"],["在几个角落各读十分钟再选","Read in several corners for ten minutes each"]],[1,"旅行结束，你想留一份纪念。哪种方式最合心意？","A trip is ending. Which keepsake sounds best?",["写一页只留给自己的日记","Write a journal page just for myself"],["挑一张明信片写给老朋友","Send a postcard to an old friend"],["和同行的人各选一张最喜欢的照片","Swap favourite photos with my companions"],["把大家的小故事收成一本共同相册","Build a shared album of everyone's stories"]],[1,"周末突然空出一整晚，你最愿意怎么过？","A whole evening unexpectedly opens up. How would you spend it?",["关掉通知，读完搁了很久的书","Silence notifications and finish a book"],["约一个熟悉的人在附近散步","Go for a walk with someone I know well"],["叫上几个人在家吃顿便饭","Have a few people over for dinner"],["参加一个可以认识新人的活动","Go to an event where I can meet new people"]],[1,"你看完了一部让人意犹未尽的电影。出影院后你想……","A movie sticks with you. After the credits you want to…",["自己走一段，让结尾沉淀下来","Walk alone and let the ending settle"],["给懂你口味的朋友发条语音","Send a voice note to a friend who knows my taste"],["和同行的人找家咖啡馆聊聊","Have coffee with the people I went with"],["参加映后讨论，听陌生人的解读","Join a discussion and hear strangers' readings"]],[1,"准备一份重要发言时，哪种练习对你最有用？","Which rehearsal helps you most before an important talk?",["独自录音，回放时做记号","Record myself alone and annotate the playback"],["请一位信任的人听一遍","Try it out on one person I trust"],["请两三位同事轮流提问","Have a few colleagues take turns asking questions"],["组织一次开放彩排，现场听反馈","Hold an open rehearsal and hear a room respond"]],[1,"社区有一小块空地，可以种点东西。你想怎样参与？","There's a patch of land for a community garden. What draws you in?",["认领一角，按自己的时间照料","Tend a small corner on my own schedule"],["和一个邻居轮班照料同一畦","Share responsibility for a bed with one neighbour"],["加入几个人的小组一起种菜","Grow vegetables with a small team"],["组织周末活动，让更多住户加入","Set up weekend sessions for the neighbourhood"]],[1,"学一门新语言，你最期待哪种练习？","Which part of learning a new language would you look forward to?",["自己找一首歌，一句句听懂","Working out a favourite song on my own"],["固定和一位语伴对话","Regular calls with one language partner"],["几位朋友每周一起做练习","A weekly practice circle with friends"],["去开放语言角，和不同的人交流","An open language exchange with new partners"]],[1,"你接到一道棘手的小任务，离截止还有两天。你想怎么开头？","You've got two days for a tricky assignment. How do you begin?",["留一段不受打扰的独处时间","Reserve some uninterrupted time alone"],["先写一版，私下请一人挑毛病","Make a draft and get one private critique"],["约两位伙伴，边聊边确定方向","Talk it through with two collaborators"],["召集相关的人开一次点子会","Gather everyone involved for a brainstorming session"]],[1,"朋友搬了家，邀请大家出点力。你最愿意认领哪项？","A friend is moving and needs help. Which job would you pick?",["独自把一箱书按类别整理好","Sort a box of books on my own"],["和朋友搭档组装一张桌子","Assemble a table with one partner"],["和几个人配合搬好家具","Coordinate with a small crew on the furniture"],["在门口接应，协调来来往往的帮手","Welcome volunteers and coordinate the whole team"]],[1,"逛完博物馆，你最想带走哪段体验？","Which part of a museum visit would you most enjoy?",["独自在一件展品前站很久","Standing alone with one object for a long time"],["和同伴各挑一件，互相讲给对方听","Trading stories about one object each with a companion"],["跟小组一起找出展品之间的联系","Finding connections among exhibits with a small group"],["听公开导览，并向全场抛出问题","Joining a public tour and asking the group a question"]],[1,"一本书读到半途卡住了，你最自然的求助方式是？","You get stuck halfway through a book. How do you get unstuck?",["独自整理笔记，回到前几页重读","Reorder my notes and reread a few pages alone"],["给一个读过的朋友发消息","Message one friend who has read it"],["约几个人互相讲懂了的部分","Have a few readers explain different passages to each other"],["去读书会把问题摆上桌","Bring the question to a book club"]],[1,"生日想做点特别的事。哪一种最像你会选的安排？","You want to mark your birthday. Which plan feels most like yours?",["给自己放半天假，去一直想去的地方","Take half a day off for a solo outing"],["和一个重要的人吃一顿长长的饭","Have a long meal with someone close"],["约几个老朋友去熟悉的小馆","Meet a few old friends at a familiar place"],["攒一桌，让不同圈子的朋友认识","Bring people from different parts of my life together"]],[1,"你有一门擅长的小手艺，有人想学。你最喜欢怎么教？","Someone wants to learn a craft you know. How would you teach it?",["先写一份带图笔记，让人自己练","Make illustrated notes people can use independently"],["找一个安静下午，一对一示范","Give a quiet one-to-one demonstration"],["开个小班，让几个人互相观摩","Run a small workshop where learners watch each other"],["在开放活动上带大家一起动手","Host an open session where everyone joins in"]],[1,"忙过一阵后，好不容易有半天休息。哪种安排最能让你恢复？","After a hectic week, which half-day would restore you?",["一个人去熟悉的地方走走","A solo walk somewhere familiar"],["和一位老朋友安静坐一会儿","Sitting quietly with an old friend"],["和几个朋友做一顿慢悠悠的午饭","Making a leisurely lunch with a few friends"],["参加热闹的市集或社区聚会","A lively market or neighbourhood gathering"]],[1,"要整理一批旧照片，哪种过程对你最有意思？","How would you most enjoy sorting old photos?",["自己慢慢看，给记得的瞬间加注","Looking through them alone and adding notes"],["找一位家人核对照片背后的故事","Checking the stories with one relative"],["邀请几位当事人边看边聊","Gathering a few people in the pictures to talk"],["办个看照片的晚上，让大家补齐记忆","Hosting a photo night to piece memories together"]],[1,"一群人刚开始学新游戏。你最舒服的位置是？","Everyone is learning a new game. Where do you feel at home?",["先独自读规则，把流程想清楚","Reading the rules alone and picturing a turn"],["和身边一个人搭档试一回合","Trying a round with the person next to me"],["加入小桌，大家边玩边提醒","Playing at a small table and sharing reminders"],["给全场做示范，把大家带进游戏","Demonstrating a round to get the whole room playing"]],[2,"你和朋友只在一座城市停留一天，出发前会怎么商量？","You and a friend have one day in a city. How do you plan it?",["把景点、车次和用餐时间都排好","Map the sights, transport and meals"],["定下两处一定要去的地方","Agree on two places we really want to see"],["只约好起点，走到哪里再聊","Agree on a starting point and decide as we go"],["到站看天气和心情，当场选方向","Pick a direction on arrival to suit the weather and mood"]],[2,"下班回家要顺路买菜。你进店时通常带着什么？","You're picking up groceries after work. What do you bring into the shop?",["写好用量的购物清单","A list with quantities for each ingredient"],["列出主菜，配菜可以换","A main dish in mind and flexible sides"],["只记住家里缺的两三样东西","Two or three things I know I'm out of"],["带个空袋，看当天什么新鲜","An empty bag and curiosity about what's fresh"]],[2,"朋友突然多带了一位客人来吃饭。你更自然的反应是？","A friend brings an extra dinner guest. What's your instinct?",["按人数重算份量，把原菜单补齐","Scale up the portions to keep the planned menu"],["保留主菜，加一道熟悉的快手菜","Keep the main and add a reliable extra dish"],["翻翻冰箱，临时换几样搭配","Scan the fridge and improvise a few changes"],["邀请大家一起拼出一桌新菜单","Invite everyone to invent a new menu together"]],[2,"收拾两晚的行李时，你会怎么下手？","You're packing for two nights away. How do you begin?",["按每天的活动写清单，逐项勾掉","Write a checklist for each day's activities"],["先收必需品，再多带一件备用衣服","Pack essentials plus one change of clothes"],["带几件好搭的，到了再决定怎么穿","Pack versatile items and choose outfits there"],["装上随身最常用的东西就出发","Grab the things I use every day and go"]],[2,"本来要在露天野餐，出门时却下起雨。你倾向于……","Rain starts just before a planned picnic. You'd rather…",["启用提前查好的室内地点","Use the indoor venue I checked beforehand"],["找附近有遮蔽的地方，保留原计划","Keep the plan but find shelter nearby"],["听听大家现在最想去哪儿","Ask where everyone feels like going now"],["顺着雨天换个玩法，连目的地也重选","Build an entirely new outing around the rain"]],[2,"周末要完成一个拖了很久的小项目，你会如何分配时间？","You want to finish a lingering weekend project. How do you use the time?",["把上午和下午拆成几段，写好每段目标","Split the day into blocks with a goal for each"],["先列出两件必须完成的事","Choose two things that really must get done"],["从最有兴致的一段开始，顺势往下做","Start with the bit that interests me and follow the momentum"],["留出整块时间，让过程中出现的想法带路","Leave the block open for ideas that emerge"]],[2,"你被请去做一次十分钟分享。上台时你最想带着……","You're giving a ten-minute talk. What would you like in your hand?",["标过停顿和用时的逐字稿","A timed script with pauses marked"],["一张列有三四个要点的提纲","A card with three or four talking points"],["一件能自然引出故事的物品","An object that will get the story started"],["一个开场问题，剩下看听众反应","An opening question and room to follow the audience"]],[2,"和朋友一起逛跳蚤市场，哪种节奏最合意？","What pace suits you at a flea market with friends?",["先看地图，按顺序不漏掉想看的摊","Use the map and work through our chosen stalls"],["约好会合时间，各自先找目标","Set a meeting time and look for our favourites"],["走一圈，哪边热闹就拐过去","Wander and turn towards whatever catches our eye"],["跟着偶遇的人或东西决定下一站","Let chance encounters choose our next stop"]],[2,"家里有一面空墙，你决定挂些东西。你会怎样安排？","You've got a blank wall to decorate. How would you arrange it?",["量好尺寸，先画一张比例图","Measure the wall and draw a scale plan"],["先定一个中心位置，再安排两边","Choose a centrepiece and build around it"],["先贴几件试试，过几天再挪","Hang a few things and move them over the week"],["每遇到一件喜欢的就添上去","Add pieces whenever I come across something I like"]],[2,"准备请朋友来一场桌游夜，你会先安排什么？","You're hosting a game night. What do you arrange first?",["按人数和时间排好每一轮游戏","Plan each round to fit the headcount and time"],["准备两款熟悉的游戏作为主选","Set aside two familiar favourites"],["请大家带自己想玩的，当晚再挑","Ask people to bring games and choose on the night"],["留出桌面，连玩不玩游戏也现场决定","Clear a table and see whether we even feel like playing"]],[2,"周末出门散步，遇到一条没走过的小路。你会……","On a weekend walk, you spot an unfamiliar path. What now?",["记下位置，下次专门安排来走","Mark it on the map and plan a return"],["看一下长度，合适就并入原路线","Check the length and fit it into the route if there's time"],["先走进去一段，到岔路口再决定","Follow it a little and decide at the next fork"],["改走这条路，看看今天会去到哪儿","Switch paths and see where the day takes me"]],[2,"为朋友准备礼物，还有一个月。你通常怎么安排？","You have a month to get a friend's gift. How do you go about it?",["尽早决定并买好，留足交付时间","Choose and buy early, with time to spare"],["先记下几种选项，下周做决定","Make a shortlist and decide next week"],["留心日常遇见的东西，等一个合适的","Keep an eye out for something that feels right"],["临近见面时按最近发生的事选","Pick close to the day, inspired by what's just happened"]],[2,"读一本很厚的书，你最愿意怎么开始？","You're starting a long book. What approach appeals to you?",["算好每天页数，在日历上标出读完日","Set a daily page count and finish date"],["先读目录，挑几个阶段目标","Read the contents and choose a few milestones"],["先读最吸引我的一章，再决定顺序","Start with the most inviting chapter and go from there"],["随手翻开，跟着好奇心来回读","Open it anywhere and follow my curiosity"]],[2,"合租厨房的柜子需要重新分配。你希望规则怎样定？","A shared kitchen needs reorganising. How should the cupboard system work?",["按物品和使用者列清单，贴好位置标签","Inventory the items and label a home for each"],["几类常用品固定，其余留出机动空间","Fix the main categories and leave flexible space"],["先随手摆一版，用一周再改","Try a rough arrangement for a week and adjust"],["放在用起来最顺的地方，大家随时挪","Let people move things to where they work best"]],[2,"天刚放晴，原定行程又有了新选择。什么最容易让你改主意？","The weather clears and a new outing is possible. What would make you change plans?",["提前确认能把原来的安排完整挪到另一天","Knowing the original plan can be fully rescheduled"],["新选择能放进现有行程的一段空档","Finding a gap where the new option fits"],["眼前的机会比原计划更让人兴奋","Feeling more excited about the new opportunity"],["难得遇上这样的天气，正好重新决定一整天","The rare weather is reason enough to rethink the whole day"]],[3,"朋友刚搬来，问你这片街区是什么样。你会先说……","A newcomer asks what your neighbourhood is like. Where do you start?",["路口哪家店开得最早，公交站在哪","Which shop opens first and where the bus stops"],["一两件能看出街坊习惯的小事","A couple of details that show the local routine"],["这里给我的感觉像一间什么样的客厅","What sort of living room the neighbourhood reminds me of"],["如果这条街是电影主角，会有什么性格","What character the street would play in a film"]],[3,"朋友错过了一场音乐会，让你说说现场怎么样。","A friend missed a concert. How would you describe it?",["从开场曲、灯光和座位位置说起","Describe the opener, the lighting and where I sat"],["讲一个我记得特别清楚的瞬间","Describe one moment I remember vividly"],["用一幅画面形容整场的情绪","Use an image to convey the mood of the night"],["讲一个能重现那种心情的小故事","Tell a little story that recreates how it felt"]],[3,"在海边捡到一块好看的石头。什么最吸引你？","You pick up a striking stone on the beach. What interests you?",["握在手里的重量、温度和纹理","Its weight, temperature and texture in my hand"],["表面哪一条纹路最特别","The most unusual line on its surface"],["它的轮廓像一幅怎样的小地图","The tiny landscape suggested by its outline"],["它要是会说话，会怎样讲这趟旅行","How it might tell its journey if it could speak"]],[3,"如果给今天拍一张照片，你最想留下什么？","If you could take one photograph of today, what would it show?",["桌上真实用过的物件和摆放位置","The actual objects on my desk and where they lay"],["一个最能代表当天的小动作","One small gesture that summed up the day"],["能让人猜到当时心情的一束光","A patch of light that hints at the day's mood"],["摆一个小场景，把今天拍成电影海报","A staged scene turning my day into a film poster"]],[3,"朋友请你帮忙给新开的咖啡馆起名字。你从哪里找灵感？","A friend wants a name for a new café. Where do you look?",["门牌、街名或店里独有的实物","The address, street name or an object in the room"],["第一杯招牌咖啡的味道","The flavour of the signature drink"],["顾客推门进来时可能有的感觉","The feeling someone might have walking in"],["想象一家只在某个故事里出现的店","A café that might exist only in a story"]],[3,"你刚学会一道家常菜，想给别人留个记录。你会写成什么样？","You've learned a family recipe. What record would you leave?",["写清克数、火候和每一步时间","Weights, heat settings and timings for every step"],["记下关键步骤和判断熟度的样子","The key steps and what “done” looks like"],["把味道跟某个季节或场景连在一起","A description tying the flavour to a season or place"],["写一封未来的人能从中猜出这顿饭的信","A letter from which a future reader could imagine the meal"]],[3,"看到橱窗里一件年代不明的旧外套，你最想了解什么？","An old coat catches your eye in a window. What do you want to know?",["布料、针脚和纽扣是什么做的","What the fabric, stitching and buttons are made of"],["袖口的磨损透露了怎样的使用习惯","What the worn cuffs reveal about its use"],["穿它的人可能在哪种场合出现","What kind of occasion its owner might have worn it to"],["如果它出现在小说里，会怎样改变情节","How it might change the plot of a novel"]],[3,"有人让你形容刚刚那场雨。你会抓住什么？","Someone asks you to describe a shower of rain. What do you focus on?",["几点开始、持续多久、下得多大","When it started, how long it lasted and how hard it fell"],["打在不同屋檐上的声音","How it sounded on different roofs"],["雨停后街道像换了表情的感觉","How the street seemed to change expression afterwards"],["用一个意外的比喻把那阵雨写出来","An unexpected metaphor for the whole shower"]],[3,"给小时候住过的房间留一页记录，你会画什么？","How would you draw a page about your childhood room?",["家具的准确位置和尺寸","The exact positions and sizes of the furniture"],["几件真正用过、现在仍记得的物品","A few objects I used and still remember clearly"],["把空间按回忆的轻重画大或缩小","A room scaled to the strength of my memories"],["把房间变成一座只有童年才懂的星球","A planet whose geography makes sense to my childhood self"]],[3,"在博物馆只能选一段导览来听。哪种介绍会让你停下？","You can hear one museum audio track. Which introduction catches you?",["逐步讲清一件器物是怎么做成的","A step-b  const result=items.slice();
 for(let i=result.length-1;i>0;i--){

}

function wrap(ctx,text,x,y,max,step){
 const units=en()?text.split(/(\s+)/u):Array.from(text);let line='';
 function emit(){ctx.fillText(line.trim(),x,y);line='';y+=step}
 for(const unit of units){
  if(line && ctx.measureText(line+unit).width>max)emit();
  if(ctx.measureText(unit).width<=max){line+=unit;continue}
  for(const ch of unit){if(line && ctx.measureText(line+ch).width>max)emit();line+=ch}
 }
 emit();return y;
}

  return y+44;
 }
 c.width=w;c.height=1600;const g=c.getContext('2d');c.height=render(g);g.fillStyle='#f7f7f2';g.fillRect(0,0,w,c.height);render(g);
 if(current!==snapshot)return;const url=c.toDataURL('image/png');$('card').src=$('download').href=url;$('card').alt=snapshot.name;$('saved').hidden=false;$('saved').scrollIntoView({block:'nearest'});

 try{data=JSON.parse(localStorage.getItem(savedKey)||'{}')||{}}catch{}

  cfg=offlineLang?{preview:true}:await fetch(apiUrl('config')).then(r=>{if(!r.ok)throw Error('config');return r.json()});
 }catch{cfg={};tx('status','暂时无法连接报告服务，请刷新后重试。','The report service is unavailable. Please try refreshing.')}
 common();
 if(data.key&&data.complete){
  show('gate');
  if(params.has('cancelled')){delete data.attempt;delete data.session;persist();tx('status','已返回，可重新选择解锁方式。','Welcome back. Choose how to unlock your result.')}
  else if(params.has('payment')){
   if(data.purchaseLang){lang=data.purchaseLang;common()}
   await redeem('receipt',{session:params.get('payment')});
  }else if(params.has('domestic')){
   data.domesticPending=true;await redeem('domestic/receipt',{},4);
  }else if(data.access)await redeem(data.access.route,data.access.extra);
  else if(data.session){
   if(!await redeem('receipt',{session:data.session})&&data.domesticPending)await redeem('domestic/receipt');
  }else if(data.domesticPending)await redeem('domestic/receipt');
 }
 else if(data.orders&&Number.isInteger(data.position)){show('quiz');question()}
 if(params.has('payment')||params.has('cancelled')||params.has('domestic'))updateLanguageUrl();
}
boot();
